const fmtTime = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  let h = d.getHours();
  const m = pad(d.getMinutes());
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
};
const fmtDateLong = dateStr => {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, {

  });

const hoursBetween = (a, b) => Math.max(0, (new Date(b) - new Date(a)) / 3600000);
const breakHours = r => (r.breaks || []).reduce((sum, b) => b.end ? sum + hoursBetween(b.start, b.end) : sum, 0);
const workedHours = r => Math.max(0, hoursBetween(r.timeIn, r.timeOut) - breakHours(r));
const breaksText = r => (r.breaks || []).map(b => b.type + " " + fmtTime(b.start) + (b.end ? "–" + fmtTime(b.end) : "…")).join(" · ");
const fmtHours = h => h == null || isNaN(h) ? "—" : h.toFixed(2);
const fmtElapsed = ms => {
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}h ${pad(m)}m`;
};

/* Same collection/doc API as before, so the rest of the app is unchanged. Every document
   lives flat under "store/", with "/" in its path swapped for "|" (e.g. store/trainees|ID|records|RID). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDmX24S5wc_EgvyV-YiuCwZoKqF4koRHeI",
  authDomain: "ojt-attendance-d6ccb.firebaseapp.com",
  databaseURL: "https://ojt-attendance-d6ccb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ojt-attendance-d6ccb",
  storageBucket: "ojt-attendance-d6ccb.firebasestorage.app",
  messagingSenderId: "310157830000",
  appId: "1:310157830000:web:1e6fe68119a9c4cd3dd1b5"
};
function createFirebaseDb() {
  firebase.initializeApp(FIREBASE_CONFIG);
  const root = firebase.database().ref("store");
  const enc = path => path.replace(/\//g, "|");
  const clean = v => JSON.parse(JSON.stringify(v)); /* Realtime Database rejects undefined */
  /* Realtime Database waits indefinitely when it can't reach the server — give up after 12s instead */
  const withTimeout = p => Promise.race([p, new Promise((_, reject) => setTimeout(() => reject(Object.assign(new Error("Database request timed out"), {
    code: "timeout"
  })), 12000))]);
  const makeDoc = path => {
    const ref = root.child(enc(path));
    return {
      async get() {
        const snap = await withTimeout(ref.once("value"));
        return { exists: snap.exists(), data: () => snap.val() };
      },
      async set(value) {
        await withTimeout(ref.set(clean(value)));
      },
      async delete() {
        await withTimeout(ref.remove());
      }
    };
  };
  const makeCollection = path => {
    const prefix = enc(path) + "|";
    const query = () => root.orderByKey().startAt(prefix).endAt(prefix + "\uf8ff");
    const toSnap = snap => {
      const docs = [];
      snap.forEach(child => {
        const id = child.key.slice(prefix.length);
        if (!id.includes("|")) docs.push({ id, data: () => child.val() });
      });
      return { docs };
    };
    return {
      doc: id => makeDoc(path + "/" + id),
      async get() {
        return toSnap(await withTimeout(query().once("value")));
      },
      onSnapshot(onNext, onError) {
        const q = query();
        const cb = snap => onNext(toSnap(snap));
        q.on("value", cb, err => onError && onError(err));
        return () => q.off("value", cb);
      }
    };
  };
  return { collection: makeCollection };
}
let _db = null;
const dbErrorMessage = e => {
  console.error("Database error:", e);
  const text = String((e && e.code) || "") + " " + String((e && e.message) || "");
  if (/timeout|timed out/i.test(text)) return "Can't reach the database (timed out). Check your internet connection and try again.";
  if (/permission[_ ]denied/i.test(text)) return "The database is blocking this. In Firebase, open Realtime Database → Rules and publish the rules, then try again.";
  return "Something went wrong talking to the database. Try again, or check the browser console for details.";
};
const loadScript = src => new Promise((res, rej) => {
  const el = document.createElement("script");
  el.src = src;
  el.onload = res;
  el.onerror = () => rej(new Error("Could not load " + src));
  document.head.appendChild(el);
});
let _sdkPromise = null;
/* Firebase is first loaded from gstatic in <head>; if that host is blocked, retry from jsDelivr. */
const ensureFirebase = () => {
  if (window.firebase && window.firebase.database) return Promise.resolve();
  if (!_sdkPromise) {
    const base = "https://cdn.jsdelivr.net/npm/firebase@10.12.2/";
    _sdkPromise = (async () => {
      if (!window.firebase) await loadScript(base + "firebase-app-compat.js");
      if (!window.firebase.database) await loadScript(base + "firebase-database-compat.js");
    })().catch(e => {
      _sdkPromise = null;
      throw new Error("Firebase SDK failed to load");
    });
  }
  return _sdkPromise;
};
const getDb = async () => {
  if (!_db) {
    await ensureFirebase();
    _db = createFirebaseDb();
  }
  return _db;
};

async function hashPin(pin) {
  try {
    const enc = new TextEncoder().encode("ojt-logbook-" + pin);
    const buf = await window.crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 0;
    for (let i = 0; i < pin.length; i++) {
      h = (h * 31 + pin.charCodeAt(i)) | 0;
    }
    return "fallback-" + h;
  }
}
const resizeImage = (file, maxDim = 640) => new Promise((resolve, reject) => {
  if (!file.type.startsWith("image/")) {
    reject(new Error("Not an image file"));
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let {
        width,
        height
      } = img;
      if (width > height) {
        if (width > maxDim) {
          height *= maxDim / width;
          width = maxDim;
        }
      } else if (height > maxDim) {
        width *= maxDim / height;
        height = maxDim;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => reject(new Error("Could not read image"));
    img.src = e.target.result;
  };
  reader.onerror = () => reject(new Error("Could not read file"));
  reader.readAsDataURL(file);
});

.ojt-roster-sub { font-size: 12px; color: var(--ojt-muted); margin-top: 2px; }

.ojt-roster-bar-fill { height: 100%; background: var(--ojt-accent); transition: width .4s cubic-bezier(.4,0,.2,1); }

.ojt-main { flex: 1; min-width: 0; padding: 26px 32px 60px; }
.ojt-main-content { animation: ojtFadeIn .35s ease both; }

.ojt-btn {
  font-family: inherit; font-size: 13.5px; font-weight: 500; padding: 9px 16px;
  border-radius: 4px; border: 1px solid transparent; cursor: pointer;
  transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease, box-shadow .15s ease;
}
.ojt-btn:active { transform: scale(0.97); }
.ojt-btn-primary { background: var(--ojt-accent); color: var(--ojt-fg); }
.ojt-btn-primary:hover { background: var(--ojt-accent-dark); box-shadow: 0 2px 10px rgba(245,179,1,0.35); }
.ojt-btn-outline { background: transparent; border-color: var(--ojt-outline-border); color: var(--ojt-fg); }
.ojt-btn-outline:hover { background: var(--ojt-hover); border-color: var(--ojt-accent); }
.ojt-btn-danger { background: transparent; border-color: var(--ojt-danger); color: var(--ojt-danger); }
.ojt-btn-danger:hover { background: var(--ojt-danger); color: var(--ojt-panel); }
.ojt-btn-ghost { background: transparent; border: none; color: var(--ojt-muted); padding: 6px 8px; }
.ojt-btn-ghost:hover { color: var(--ojt-fg); text-decoration: underline; }
.ojt-btn:focus-visible, .ojt-roster-item:focus-visible, .ojt-input:focus-visible { outline: 2px solid var(--ojt-accent-dark); outline-offset: 1px; }
.ojt-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.ojt-input, .ojt-select {
  font-family: inherit; font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--ojt-border);
  border-radius: 4px; background: var(--ojt-panel); color: var(--ojt-fg); width: 100%;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.ojt-input:focus, .ojt-select:focus { outline: none; border-color: var(--ojt-accent); box-shadow: 0 0 0 3px rgba(245,179,1,0.25); }
.ojt-field label { display: block; font-size: 12px; color: var(--ojt-muted); margin-bottom: 4px; }

.ojt-panel {
  background: var(--ojt-panel); border: 1px solid var(--ojt-border); border-radius: 8px;
  transition: box-shadow .2s ease;
}

.ojt-progress-track { height: 10px; background: var(--ojt-track); border-radius: 5px; overflow: hidden; }
.ojt-progress-fill { height: 100%; background: var(--ojt-accent); transition: width .5s cubic-bezier(.4,0,.2,1); }
.ojt-progress-fill.complete { background: #C98F00; }

.ojt-pulse-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ojt-accent-dark); display: inline-block;
  animation: ojtpulse 1.6s infinite;
}
@keyframes ojtpulse { 0% { box-shadow: 0 0 0 0 rgba(224,164,0,0.5);} 70% { box-shadow: 0 0 0 7px rgba(224,164,0,0);} 100% {box-shadow: 0 0 0 0 rgba(224,164,0,0);} }
@keyframes ojtFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ojtSlideDown { from { opacity: 0; transform: translateY(-8px); max-height: 0; } to { opacity: 1; transform: translateY(0); max-height: 600px; } }
.ojt-anim-in { animation: ojtSlideDown .28s cubic-bezier(.4,0,.2,1) both; overflow: hidden; }

.ojt-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ojt-table th { text-align: left; font-weight: 600; color: var(--ojt-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--ojt-border); }
.ojt-table td { padding: 10px 10px; border-bottom: 1px solid var(--ojt-track); vertical-align: middle; }
.ojt-table tr { transition: background .12s ease; }
.ojt-table tr:hover td { background: var(--ojt-table-hover); }
.ojt-row-actions { display: flex; gap: 10px; }

.ojt-empty { text-align: center; padding: 50px 20px; color: var(--ojt-muted); }
.ojt-empty .disp { font-size: 19px; color: var(--ojt-fg); margin-bottom: 6px; }

.ojt-avatar, .ojt-avatar-sm {
  border-radius: 50%; object-fit: cover; flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; background: var(--ojt-hover); color: var(--ojt-amber); font-weight: 600;
  border: 1px solid var(--ojt-border); transition: box-shadow .15s ease;
}
.ojt-avatar { width: 56px; height: 56px; font-size: 19px; }
.ojt-avatar-sm { width: 30px; height: 30px; font-size: 12px; }
.ojt-roster-item.active .ojt-avatar-sm { background: var(--ojt-accent); color: var(--ojt-fg); border-color: transparent; }
.ojt-roster-row { display: flex; align-items: center; gap: 10px; }
.ojt-photo-picker { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.ojt-photo-picker input[type="file"] { font-size: 12.5px; }

.ojt-reg-photo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 14px; }
.ojt-reg-photo-frame {
  width: 220px; height: 220px; max-width: 100%; border-radius: 12px; overflow: hidden;
  border: 2px dashed var(--ojt-outline-border); background: var(--ojt-track);
  display: flex; align-items: center; justify-content: center; text-align: center;
  color: var(--ojt-muted); font-size: 12.5px; padding: 12px;
}
.ojt-reg-photo-frame.filled { border-style: solid; border-color: var(--ojt-accent); padding: 0; }
.ojt-reg-photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ojt-reg-hint { font-size: 12px; color: var(--ojt-muted); text-align: center; margin: 0; }
img.ojt-avatar, img.ojt-avatar-sm { cursor: zoom-in; }
.ojt-lightbox {
  position: fixed; inset: 0; background: var(--ojt-overlay, rgba(0,0,0,.7)); z-index: 2000;
  display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out;
  animation: ojtFadeIn .2s ease both;
}
.ojt-lightbox img { max-width: min(92vw, 640px); max-height: 88vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #fff; }
.ojt-lightbox button {
  position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
  border: none; background: #fff; color: #111; font-size: 20px; cursor: pointer;
}
.ojt-avatar { width: 96px; height: 96px; font-size: 30px; }

@media (max-width: 760px) {
  .ojt-body { flex-direction: column; }
  .ojt-sidebar { width: 100%; min-height: unset; border-right: none; border-bottom: 1px solid var(--ojt-border);
    display: flex; overflow-x: auto; padding: 12px; gap: 6px; }
  .ojt-sidebar-head { display: none; }
  .ojt-roster-item { width: auto; min-width: 160px; flex-shrink: 0; }
  .ojt-main { padding: 20px 16px 50px; }
  .ojt-header { padding: 20px 16px 16px; }
  .ojt-nav { padding: 0 16px; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .ojt-app *, .ojt-app *::before, .ojt-app *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---------- skip link ---------- */
.ojt-skip-link {
  position: absolute; left: 12px; top: -60px; background: var(--ojt-accent); color: var(--ojt-fg);
  padding: 10px 16px; border-radius: 4px; font-size: 13.5px; font-weight: 600; z-index: 1000;
  transition: top .15s ease; text-decoration: none;
}
.ojt-skip-link:focus { top: 12px; }

/* ---------- scroll progress bar ---------- */
.ojt-scroll-progress {
  position: fixed; top: 0; left: 0; height: 3px; background: var(--ojt-accent); z-index: 900;
  transition: width .1s linear;
}

/* ---------- sticky header + top row ---------- */
.ojt-header { position: sticky; top: 0; z-index: 100; background: var(--ojt-bg); }
.ojt-header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ojt-icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 50%; border: 1px solid var(--ojt-border); background: var(--ojt-panel); color: var(--ojt-fg);
  cursor: pointer; font-size: 15px; transition: background .15s ease, border-color .15s ease, transform .1s ease;
}
.ojt-icon-btn:hover { background: var(--ojt-hover); border-color: var(--ojt-accent); }
.ojt-icon-btn:active { transform: scale(0.93); }
.ojt-icon-btn:focus-visible { outline: 2px solid var(--ojt-accent-dark); outline-offset: 1px; }

/* ---------- search ---------- */
.ojt-search-wrap { position: relative; min-width: 180px; flex: 1; max-width: 280px; }
.ojt-search-wrap input { padding-left: 30px; }
.ojt-search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ojt-muted); font-size: 13px; pointer-events: none; }
.ojt-search-empty { padding: 3px 8px; font-size: 12px; color: var(--ojt-muted); }

/* ---------- mobile nav ---------- */
.ojt-nav { position: relative; }
.ojt-mobile-menu-btn { display: none; }
@media (max-width: 560px) {
  .ojt-nav { flex-direction: column; padding: 0; }
  .ojt-mobile-menu-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    font-family: inherit; font-size: 13.5px; font-weight: 600; background: transparent; border: none;
    padding: 13px 16px; cursor: pointer; color: var(--ojt-fg);
  }
  .ojt-nav-links { display: none; flex-direction: column; padding: 0 16px 8px; }
  .ojt-nav-links.open { display: flex; }
  .ojt-nav-btn { border-bottom: none; border-left: 2px solid transparent; padding: 10px 8px; }
  .ojt-nav-btn.active { border-left-color: var(--ojt-accent); border-bottom-color: transparent; }
}

/* ---------- scroll to top ---------- */
.ojt-scroll-top-btn {
  position: fixed; bottom: 22px; right: 22px; width: 42px; height: 42px; border-radius: 50%;
  background: var(--ojt-accent); color: var(--ojt-fg); border: none; cursor: pointer; font-size: 16px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.25); z-index: 400; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease;
}
.ojt-scroll-top-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
.ojt-scroll-top-btn:hover { background: var(--ojt-accent-dark); }

/* ---------- spinner ---------- */
.ojt-spinner {
  display: inline-block; width: 16px; height: 16px; border: 2px solid var(--ojt-border);
  border-top-color: var(--ojt-accent); border-radius: 50%; animation: ojtspin .7s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes ojtspin { to { transform: rotate(360deg); } }
.ojt-loading-row { display: flex; align-items: center; padding: 18px; color: var(--ojt-muted); font-size: 13.5px; }

/* ---------- FAQ / help ---------- */
.ojt-faq-item { border-bottom: 1px solid var(--ojt-border); }
.ojt-faq-item:last-child { border-bottom: none; }
.ojt-faq-q {
  width: 100%; text-align: left; background: transparent; border: none; font-family: inherit;
  font-size: 14px; font-weight: 600; color: var(--ojt-fg); padding: 14px 4px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.ojt-faq-caret { transition: transform .2s ease; color: var(--ojt-muted); flex-shrink: 0; }
.ojt-faq-item.open .ojt-faq-caret { transform: rotate(180deg); }
.ojt-faq-a { padding: 0 4px 14px; font-size: 13.5px; color: var(--ojt-muted); line-height: 1.6; }

/* ---------- modal ---------- */
.ojt-modal-overlay {
  position: fixed; inset: 0; background: var(--ojt-overlay); display: flex; align-items: center;
  justify-content: center; z-index: 800; padding: 20px; animation: ojtFadeIn .15s ease both;
}
.ojt-modal {
  background: var(--ojt-panel); border: 1px solid var(--ojt-border); border-radius: 10px;
  padding: 22px; max-width: 400px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.ojt-modal h3 { margin: 0 0 8px; font-size: 17px; }
.ojt-modal p { margin: 0 0 18px; font-size: 13.5px; color: var(--ojt-muted); line-height: 1.5; }
.ojt-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ---------- last updated badge ---------- */
.ojt-last-updated { font-size: 11.5px; color: var(--ojt-muted); margin-top: 4px; }

/* ---------- homepage menu cards ---------- */
.ojt-home-card {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
  width: 100%; background: var(--ojt-panel); border: 1px solid var(--ojt-border); border-radius: 8px;
  padding: 20px 22px; cursor: pointer; font-family: inherit; color: var(--ojt-fg);
  transition: border-color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.ojt-home-card:hover { border-color: var(--ojt-accent); box-shadow: 0 4px 18px rgba(0,0,0,0.07); transform: translateY(-1px); }
.ojt-home-card:active { transform: translateY(0) scale(0.99); }
.ojt-home-card:focus-visible { outline: 2px solid var(--ojt-accent-dark); outline-offset: 2px; }
.ojt-home-card-title { font-size: 18px; font-weight: 600; margin: 0 0 5px; }
.ojt-home-card-desc { font-size: 13px; color: var(--ojt-muted); margin: 0; max-width: 440px; line-height: 1.5; }
.ojt-home-card-stat { font-size: 11.5px; color: var(--ojt-amber); margin: 8px 0 0; }
.ojt-home-card-arrow { font-size: 20px; color: var(--ojt-muted); flex-shrink: 0; transition: transform .15s ease, color .15s ease; }
.ojt-home-card:hover .ojt-home-card-arrow { transform: translateX(3px); color: var(--ojt-accent-dark); }

/* ---------- job hiring: Indeed-style card + outbound link ---------- */
.ojt-indeed-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  background: var(--ojt-hover); border: 1px solid var(--ojt-outline-border); border-radius: 8px;
  padding: 16px 18px; margin-top: 16px;
}
.ojt-indeed-banner p { margin: 0; font-size: 13px; color: var(--ojt-fg); max-width: 460px; line-height: 1.5; }
.ojt-indeed-banner strong { display: block; font-size: 14.5px; margin-bottom: 3px; }
.ojt-city-tag {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ojt-muted);
  background: var(--ojt-track); padding: 3px 9px; border-radius: 20px;
}
.ojt-live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #2E9E5B; display: inline-block; margin-right: 5px;
  animation: ojtpulse 1.6s infinite;
}

/* ---------- newsletter-style toast (used for success states) ---------- */
.ojt-toast {
  font-size: 12.5px; padding: 8px 12px; border-radius: 4px; background: var(--ojt-hover); color: var(--ojt-amber);
  display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
}


.ojt-duration-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--ojt-muted); }
.ojt-chip { font-family: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--ojt-outline-border); background: transparent; color: var(--ojt-fg); cursor: pointer; }
.ojt-chip:hover { background: var(--ojt-hover); border-color: var(--ojt-accent); }
.ojt-chip.active { background: var(--ojt-accent); border-color: var(--ojt-accent); font-weight: 600; }
.ojt-expiry-badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--ojt-hover); color: var(--ojt-amber); margin-top: 8px; }
.ojt-expiry-badge.soon { background: rgba(192,57,43,0.12); color: var(--ojt-danger); }

/* ---------- responsive polish: phones, tablets, desktop ---------- */
html { -webkit-text-size-adjust: 100%; }
.ojt-app img { max-width: 100%; }
.ojt-modal { max-height: 90vh; overflow-y: auto; }
.ojt-scroll-top-btn { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 900px) {
  .ojt-main { padding: 22px 20px 56px; }
  .ojt-header, .ojt-nav { padding-left: 20px; padding-right: 20px; }
  .ojt-app [style*="repeat(4, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
}
@media (max-width: 760px) {
  /* inputs at 16px stop iOS from zooming the page on focus; bigger touch targets */
  .ojt-input, .ojt-select, input, select, textarea { font-size: 16px !important; }
  .ojt-btn { min-height: 42px; }
  .ojt-icon-btn { width: 40px; height: 40px; }
  .ojt-nav-btn, .ojt-mobile-menu-btn { min-height: 44px; }
  .ojt-roster-item { min-height: 56px; }
  .ojt-header { position: static; }
  .ojt-header h1 { font-size: 23px; }
  .ojt-header-actions { width: 100%; }
  .ojt-search-wrap { max-width: none; min-width: 0; }
  /* two-column forms become one column */
  .ojt-app [style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
  /* tables scroll sideways instead of breaking the page */
  .ojt-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
  .ojt-table td, .ojt-table th { padding: 10px 8px; }
  /* login / register card */
  .ojt-app[style*="padding-top"] { padding-top: 20px !important; padding-left: 12px; padding-right: 12px; }
  .ojt-reg-photo-frame { width: min(260px, 80vw); height: min(260px, 80vw); }
  .ojt-modal-overlay { align-items: flex-end; padding: 0; }
  .ojt-modal { max-width: none; border-radius: 14px 14px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  .ojt-lightbox img { max-width: 96vw; }
}
@media (max-width: 380px) {
  .ojt-app [style*="repeat(4, 1fr)"] { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
  .ojt-main { padding: 16px 12px 48px; }
}
@media (hover: none) {
  .ojt-roster-item:hover, .ojt-btn:active { transform: none; }
}


/* =====================================================================
   THEME: "School ledger" — CTU maroon + brass, paper, ink, ruled lines
   ===================================================================== */
.ojt-shell {
  --ojt-bg: #FBF7EA; --ojt-fg: #25191A; --ojt-muted: #6F6058; --ojt-border: #DACDAE;
  --ojt-panel: #FFFDF6; --ojt-hover: #F5E8C6; --ojt-accent: #C9962B; --ojt-accent-dark: #A87A16;
  --ojt-danger: #B3261E; --ojt-table-hover: #FAF1D6; --ojt-track: #EDE3C8; --ojt-amber: #7A1F2B;
  --ojt-closed-bg: #ECE5D2; --ojt-outline-border: #BFAF86; --ojt-overlay: rgba(30,12,14,0.55);
  --ojt-side-bg: #E6DBC0; --ojt-side-line: rgba(90,50,30,0.09);
  --ojt-maroon: #7A1F2B; --ojt-maroon-dark: #5C1520; --ojt-cream: #FBF1D8;
}
.ojt-shell[data-theme="dark"] {
  --ojt-bg: #1C1314; --ojt-fg: #F1E7D2; --ojt-muted: #B3A592; --ojt-border: #4A3537;
  --ojt-panel: #261B1C; --ojt-hover: #3B2A24; --ojt-accent: #D9A93B; --ojt-accent-dark: #E8BD57;
  --ojt-danger: #F0776C; --ojt-table-hover: #2F2220; --ojt-track: #33262A; --ojt-amber: #E9BF6A;
  --ojt-closed-bg: #33262A; --ojt-outline-border: #6A5253; --ojt-overlay: rgba(0,0,0,0.7);
  --ojt-side-bg: #130C0D; --ojt-side-line: rgba(255,230,200,0.04);
  --ojt-maroon: #8F2635; --ojt-maroon-dark: #6E1B27; --ojt-cream: #FBF1D8;
}
.ojt-app .disp, .ojt-header h1 { font-family: 'Zilla Slab', Georgia, serif; letter-spacing: 0; }
.ojt-app .mono, .ojt-table td.mono, .ojt-status-pill, .ojt-expiry-badge { font-family: 'Courier Prime', 'Courier New', monospace; }
.ojt-app { box-shadow: 0 0 0 1px var(--ojt-border), 0 0 40px rgba(60,30,20,0.12); }

/* header: maroon band, brass rule, seal on a cream disc */
.ojt-header {
  background: var(--ojt-maroon); color: var(--ojt-cream); align-items: center;
  border-bottom: 4px solid var(--ojt-accent); padding: 18px 32px;
}
.ojt-header h1 { font-size: 27px; font-weight: 700; color: var(--ojt-cream); }
.ojt-header h1::after { display: none; }
.ojt-header p { color: rgba(251,241,216,0.78); margin-top: 3px; }
.ojt-header-brand:hover h1 { color: #fff; }
.ojt-header-brand img { background: #fff; border-radius: 50%; padding: 2px; box-shadow: 0 0 0 2px var(--ojt-accent); width: 52px !important; height: 52px !important; }
.ojt-header .ojt-icon-btn, .ojt-header .ojt-btn-outline { border-color: rgba(251,241,216,0.5); color: var(--ojt-cream); background: transparent; }
.ojt-header .ojt-icon-btn:hover, .ojt-header .ojt-btn-outline:hover { background: rgba(251,241,216,0.14); border-color: var(--ojt-cream); }
.ojt-header .ojt-btn-primary { background: var(--ojt-accent); color: #2A1A12; }
.ojt-header .ojt-btn-primary:hover { background: #E0B04A; box-shadow: none; }

/* tabs like ledger index tabs */
.ojt-nav { background: var(--ojt-side-bg); padding: 10px 32px 0; gap: 6px; border-bottom: 1px solid var(--ojt-outline-border); }
.ojt-nav-btn {
  background: rgba(0,0,0,0.04); border: 1px solid var(--ojt-border); border-bottom: none; border-radius: 3px 3px 0 0;
  padding: 9px 16px 8px; margin-bottom: -1px; letter-spacing: 0.02em; font-weight: 600;
}
.ojt-nav-btn.active { background: var(--ojt-bg); color: var(--ojt-maroon); border-color: var(--ojt-outline-border); border-top: 3px solid var(--ojt-maroon); }
[data-theme="dark"] .ojt-nav-btn.active { color: var(--ojt-accent-dark); border-top-color: var(--ojt-accent); }

/* paper with faint ruled lines */
.ojt-main { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--ojt-side-line) 31px, var(--ojt-side-line) 32px); }
.ojt-sidebar { background: rgba(0,0,0,0.025); border-right: 1px solid var(--ojt-outline-border); }
.ojt-sidebar-head { font-family: 'Courier Prime', monospace; font-weight: 700; letter-spacing: 0.12em; border-bottom: 2px solid var(--ojt-maroon); }
[data-theme="dark"] .ojt-sidebar-head { border-bottom-color: var(--ojt-accent); }
.ojt-roster-item { border-radius: 2px; border-left-width: 4px; }
.ojt-roster-item:hover { transform: none; }
.ojt-roster-item.active { border-left-color: var(--ojt-maroon); }
.ojt-roster-bar-track { border-radius: 0; height: 4px; }
.ojt-roster-bar-fill { background: var(--ojt-maroon); }

/* panels: document cards with a double rule on top */
.ojt-panel { border-radius: 2px; border: 1px solid var(--ojt-outline-border); border-top: 4px double var(--ojt-maroon); box-shadow: 0 1px 0 rgba(60,30,20,0.08); }
[data-theme="dark"] .ojt-panel { border-top-color: var(--ojt-accent); }

/* buttons */
.ojt-btn { border-radius: 2px; font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 16px; }
.ojt-btn-primary { background: var(--ojt-maroon); color: var(--ojt-cream); border-color: var(--ojt-maroon-dark); }
.ojt-btn-primary:hover { background: var(--ojt-maroon-dark); box-shadow: none; }
.ojt-btn-outline { border-width: 1.5px; border-color: var(--ojt-fg); }
.ojt-btn-outline:hover { background: var(--ojt-fg); color: var(--ojt-bg); border-color: var(--ojt-fg); }
.ojt-btn-ghost { text-transform: none; letter-spacing: 0; font-weight: 600; }
.ojt-btn:focus-visible, .ojt-input:focus-visible, .ojt-nav-btn:focus-visible { outline: 2px solid var(--ojt-maroon); outline-offset: 2px; }
[data-theme="dark"] .ojt-btn:focus-visible { outline-color: var(--ojt-accent); }
.ojt-btn:active { transform: translateY(1px); }
.ojt-icon-btn { border-radius: 2px; }

/* form fields: underlined like a paper form */
.ojt-input, .ojt-select { border-radius: 0; border: none; border-bottom: 2px solid var(--ojt-outline-border); background: rgba(0,0,0,0.035); padding: 9px 10px; }
.ojt-input:focus, .ojt-select:focus { border-bottom-color: var(--ojt-maroon); box-shadow: none; background: var(--ojt-panel); }
[data-theme="dark"] .ojt-input:focus, [data-theme="dark"] .ojt-select:focus { border-bottom-color: var(--ojt-accent); }
.ojt-header .ojt-input { background: var(--ojt-panel); border-bottom-color: var(--ojt-accent); }
.ojt-field label { font-family: 'Courier Prime', monospace; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ojt-muted); }

/* progress: a ruler */
.ojt-progress-track { height: 14px; border-radius: 0; border: 1px solid var(--ojt-outline-border);
  background: repeating-linear-gradient(to right, var(--ojt-track) 0, var(--ojt-track) 9px, var(--ojt-border) 9px, var(--ojt-border) 10px); }
.ojt-progress-fill { background: var(--ojt-maroon); }
.ojt-progress-fill.complete { background: var(--ojt-accent-dark); }
[data-theme="dark"] .ojt-progress-fill { background: var(--ojt-accent); }

/* tables: ledger */
.ojt-table th { font-family: 'Courier Prime', monospace; font-weight: 700; letter-spacing: 0.1em; color: var(--ojt-maroon); border-bottom: 2px solid var(--ojt-maroon); }
[data-theme="dark"] .ojt-table th { color: var(--ojt-accent); border-bottom-color: var(--ojt-accent); }
.ojt-table td { border-bottom: 1px dashed var(--ojt-outline-border); }

/* status "stamps" */
.ojt-status-pill, .ojt-expiry-badge { border-radius: 2px; border: 1.5px solid currentColor; background: transparent; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; font-weight: 700; }
.ojt-status-pill.open { color: #2F6B3A; background: transparent; transform: rotate(-1.5deg); }
[data-theme="dark"] .ojt-status-pill.open { color: #7FCB8D; }
.ojt-status-pill.closed { color: var(--ojt-muted); background: transparent; }
.ojt-expiry-badge { background: transparent; color: var(--ojt-maroon); }
[data-theme="dark"] .ojt-expiry-badge { color: var(--ojt-accent-dark); }
.ojt-expiry-badge.soon { background: transparent; color: var(--ojt-danger); }
.ojt-chip { border-radius: 2px; font-weight: 600; }
.ojt-chip.active { background: var(--ojt-maroon); border-color: var(--ojt-maroon); color: var(--ojt-cream); }

/* photos: ID-card style */
.ojt-avatar, .ojt-avatar-sm { border-radius: 3px; border: 2px solid var(--ojt-fg); background: var(--ojt-hover); color: var(--ojt-maroon); }
.ojt-roster-item.active .ojt-avatar-sm { background: var(--ojt-maroon); color: var(--ojt-cream); border-color: var(--ojt-fg); }
.ojt-reg-photo-frame { border-radius: 2px; border: 2px dashed var(--ojt-maroon); }
.ojt-reg-photo-frame.filled { border: 3px solid var(--ojt-fg); box-shadow: 4px 4px 0 var(--ojt-accent); }
.ojt-lightbox img { border-radius: 2px; border: 6px solid #fff; }

/* home cards: index cards */
.ojt-home-card { border-radius: 2px; border-left: 6px solid var(--ojt-maroon); }
.ojt-home-card:hover { background: var(--ojt-hover); }
.ojt-indeed-banner { border-radius: 2px; border: 1px dashed var(--ojt-maroon); }
.ojt-modal { border-radius: 2px; border-top: 5px solid var(--ojt-maroon); }
.ojt-city-tag { border-radius: 2px; }
.ojt-toast { border-radius: 2px; }
.ojt-scroll-top-btn { border-radius: 2px; background: var(--ojt-maroon); color: var(--ojt-cream); }
.ojt-scroll-progress { background: var(--ojt-accent); }
.ojt-side-banner::after { background: var(--ojt-maroon); height: 6px; }
.ojt-side-banner::before { opacity: 0.09; }
.ojt-pulse-dot { background: var(--ojt-maroon); }

@media (max-width: 760px) {
  .ojt-header { padding: 14px 16px; }
  .ojt-header-brand img { width: 44px !important; height: 44px !important; }
  .ojt-nav { padding: 8px 12px 0; }
  .ojt-btn { font-size: 12px; }
}


/* journal + ratings */
.ojt-post, .ojt-composer { padding: 16px 18px; margin-bottom: 12px; }
.ojt-post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.ojt-post-meta { font-size: 11.5px; color: var(--ojt-muted); margin-top: 2px; }
.ojt-post-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; font-size: 15px; margin: 0; }
.ojt-composer textarea, .ojt-post textarea { width: 100%; resize: vertical; line-height: 1.5; }
.ojt-composer-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
.ojt-composer-bar .mono { font-size: 11.5px; color: var(--ojt-muted); }
.ojt-stars { display: inline-flex; gap: 1px; font-size: 16px; line-height: 1; vertical-align: middle; }
.ojt-stars span, .ojt-star-btn { color: var(--ojt-outline-border); }
.ojt-stars span.on, .ojt-star-btn.on { color: var(--ojt-accent); }
.ojt-star-btn { background: none; border: none; padding: 0 2px; font-size: inherit; cursor: pointer; }
.ojt-rate-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--ojt-outline-border); font-size: 14px; }
.ojt-rate-breakdown { margin: 4px 0 10px; }
.ojt-rating-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ojt-rating-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; font-family: inherit; color: var(--ojt-fg); }
.ojt-rating-card:hover, .ojt-rating-card.active { background: var(--ojt-hover); }
.ojt-rating-card.active { border-color: var(--ojt-maroon); }
@media (max-width: 760px) { .ojt-post, .ojt-composer { padding: 14px; } .ojt-rate-row { font-size: 13.5px; } }

.ojt-reg-photo-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* =====================================================================
   THEME: "Doodle notebook" — ink outlines, marker yellow, hand-drawn edges
   Built from the supplied doodle sheets (pattern / hero / badge).
   ===================================================================== */
.ojt-shell {
  --ink: #1B1B1F; --on-accent: #1B1B1F; --shadow-col: #1B1B1F;
  --ojt-bg: #FFFEF7; --ojt-fg: #1B1B1F; --ojt-muted: #5E5B55; --ojt-border: #D8D1BA;
  --ojt-panel: #FFFFFF; --ojt-hover: #FFF0B3; --ojt-accent: #FFD43B; --ojt-accent-dark: #F2B705;
  --ojt-danger: #D6382C; --ojt-table-hover: #FFF8D6; --ojt-track: #F4EFDD; --ojt-amber: #6B4A00;
  --ojt-closed-bg: #EFEBDD; --ojt-outline-border: #B9B19A; --ojt-overlay: rgba(27,27,31,0.55);
  --ojt-side-bg: #F1EBD6; --ojt-side-line: rgba(27,27,31,0.16);
  --ojt-maroon: #1B1B1F; --ojt-maroon-dark: #000; --ojt-cream: #FFFEF7;
  --coral: #FF6B5A; --mint: #BDEBCF; --sky: #CBE8FF;
  --wob: 70px 10px 56px 10px / 10px 56px 10px 70px;
  --wob2: 10px 56px 10px 70px / 70px 10px 56px 10px;
  --wob-sm: 14px 5px 16px 6px / 6px 16px 5px 14px;
  --font-body: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
  --font-disp: 'Caveat Brush', 'Patrick Hand', 'Comic Sans MS', cursive;
  --inv: none;
  font-family: var(--font-body);
  font-size: 17px;
}
.ojt-shell[data-theme="dark"] {
  --ink: #F4F1E6; --on-accent: #1B1B1F; --shadow-col: #0A0C0B;
  --ojt-bg: #232826; --ojt-fg: #F4F1E6; --ojt-muted: #B7B3A4; --ojt-border: #4A524E;
  --ojt-panel: #2C322F; --ojt-hover: #4A4423; --ojt-accent: #FFD84D; --ojt-accent-dark: #FFE27A;
  --ojt-danger: #FF8A7A; --ojt-table-hover: #343B2B; --ojt-track: #1D211F; --ojt-amber: #FFE08A;
  --ojt-closed-bg: #343A37; --ojt-outline-border: #6A726D; --ojt-overlay: rgba(0,0,0,0.7);
  --ojt-side-bg: #181C1A; --ojt-side-line: rgba(244,241,230,0.2);
  --ojt-maroon: #F4F1E6; --ojt-maroon-dark: #fff; --ojt-cream: #232826;
  --coral: #FF8A7A; --mint: #2F5A44; --sky: #2A4A63;
  --inv: invert(1);
}
.ojt-shell, .ojt-shell button, .ojt-shell input, .ojt-shell select, .ojt-shell textarea { font-family: var(--font-body); }
.ojt-shell ::selection { background: var(--ojt-accent); color: var(--on-accent); }
.ojt-app .disp, .ojt-header h1, .ojt-modal h3 { font-family: var(--font-disp); font-weight: 400; letter-spacing: 0.01em; }
.ojt-app .mono, .ojt-table td.mono, .ojt-status-pill, .ojt-expiry-badge { font-family: var(--font-body); }
.ojt-app { background: var(--ojt-bg); box-shadow: none; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }

/* desk with doodles on either side of the page */
.ojt-side-banner {
  background-image: none; background-color: var(--ojt-side-bg); border: none !important;
}
.ojt-side-banner::before {
  content: ""; position: absolute; inset: 0; top: 0; left: 0; width: auto; max-width: none; aspect-ratio: auto; transform: none;
  background: url("${DOODLE_PATTERN}") 0 0 / 470px 470px repeat; opacity: 0.4; filter: var(--inv);
}
.ojt-side-banner.right::before { background-position: 190px 240px; transform: scaleX(-1); }
.ojt-side-banner::after { display: none; }

/* header: paper with a faint doodle strip, thick ink underline */
.ojt-header {
  background: var(--ojt-bg); color: var(--ojt-fg); border-bottom: 3px solid var(--ink); padding: 16px 32px; overflow: hidden;
}
.ojt-header::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: url("${DOODLE_PATTERN}") 40% 22% / 520px 520px repeat-x; opacity: 0.1; filter: var(--inv);
}
.ojt-header > * { position: relative; z-index: 1; }
.ojt-header h1 {
  font-size: 38px; line-height: 1; color: var(--ojt-fg); display: inline-block; padding: 0 8px; margin-left: -8px;
  background: linear-gradient(transparent 52%, var(--ojt-accent) 52% 90%, transparent 90%); transform: rotate(-1.2deg);
}
[data-theme="dark"] .ojt-header h1 { color: var(--ojt-fg); background: linear-gradient(transparent 52%, rgba(255,216,77,0.38) 52% 90%, transparent 90%); }
.ojt-header p { color: var(--ojt-muted); font-size: 15.5px; margin-top: 6px; }
.ojt-header-brand:hover h1 { color: var(--ojt-fg); }
.ojt-header-brand:hover img { animation: ojtWiggle .5s ease-in-out; }
.ojt-header-brand img {
  background: #fff; border-radius: 50%; padding: 0; width: 56px !important; height: 56px !important;
  border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--shadow-col);
}
@keyframes ojtWiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
.ojt-header .ojt-icon-btn, .ojt-header .ojt-btn-outline { border-color: var(--ink); color: var(--ink); background: var(--ojt-panel); }
.ojt-header .ojt-icon-btn:hover, .ojt-header .ojt-btn-outline:hover { background: var(--ojt-hover); border-color: var(--ink); color: var(--ink); }
.ojt-header .ojt-btn-primary { background: var(--ojt-accent); color: var(--on-accent); }
.ojt-header .ojt-btn-primary:hover { background: var(--ojt-accent-dark); }
.ojt-header .ojt-input { background: var(--ojt-panel); border-color: var(--ink); }

/* nav: sticker tabs */
.ojt-nav { background: transparent; padding: 14px 32px 12px; gap: 8px; border-bottom: 3px dashed var(--ojt-outline-border); }
.ojt-nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
.ojt-nav-btn {
  background: var(--ojt-panel); border: 2.5px solid var(--ink); border-top-width: 2.5px; border-radius: var(--wob-sm);
  padding: 5px 16px 4px; margin: 0; font-size: 17px; font-weight: 400; letter-spacing: 0; color: var(--ink);
  box-shadow: 2px 2px 0 var(--shadow-col); transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.ojt-nav-btn:hover { background: var(--ojt-hover); color: var(--ink); transform: translateY(-2px) rotate(-1deg); }
.ojt-nav-btn.active { background: var(--ojt-accent); color: var(--on-accent); border-color: var(--ink); border-top-width: 2.5px; transform: rotate(-1.5deg); }
[data-theme="dark"] .ojt-nav-btn.active { color: var(--on-accent); border-top-color: var(--ink); }
.ojt-nav-btn:focus-visible, .ojt-btn:focus-visible, .ojt-input:focus-visible, .ojt-roster-item:focus-visible,
.ojt-home-card:focus-visible, .ojt-icon-btn:focus-visible, .ojt-chip:focus-visible, .ojt-faq-q:focus-visible { outline: 3px dashed var(--coral); outline-offset: 3px; }

/* paper: dotted sketchbook grid */
.ojt-main { background-image: radial-gradient(var(--ojt-side-line) 1.3px, transparent 1.6px); background-size: 26px 26px; }
.ojt-sidebar { background: transparent; border-right: 3px dashed var(--ojt-outline-border); }
.ojt-sidebar-head { font-family: var(--font-disp); font-size: 22px; font-weight: 400; text-transform: none; letter-spacing: 0.02em; color: var(--ink); border-bottom: 3px dashed var(--ink); }
.ojt-roster-item {
  border: 2.5px solid transparent; border-left-width: 2.5px; border-radius: var(--wob-sm); padding: 9px 10px; transition: transform .12s ease, background .12s ease;
}
.ojt-roster-item:hover { background: var(--ojt-hover); transform: none; }
.ojt-roster-item.active { background: var(--ojt-hover); border-color: var(--ink); border-left-color: var(--ink); box-shadow: 3px 3px 0 var(--shadow-col); transform: rotate(-0.6deg); }
.ojt-roster-name { font-family: var(--font-disp); font-weight: 400; font-size: 20px; line-height: 1.1; }
.ojt-roster-sub { font-size: 14px; }
.ojt-roster-bar-track { height: 9px; border: 2px solid var(--ink); border-radius: 6px; background: var(--ojt-panel); }
.ojt-roster-bar-fill { background: repeating-linear-gradient(-45deg, var(--ojt-accent) 0 4px, var(--ink) 4px 5px); }

/* panels: sticker cards with hard shadows and wobbly outlines */
.ojt-panel {
  background: var(--ojt-panel); border: 2.5px solid var(--ink); border-top: 2.5px solid var(--ink); border-radius: var(--wob);
  box-shadow: 4px 4px 0 var(--shadow-col);
}
.ojt-panel:nth-of-type(even) { border-radius: var(--wob2); }

/* buttons */
.ojt-btn {
  font-size: 16px; font-weight: 400; letter-spacing: 0.01em; text-transform: none; padding: 7px 16px 6px; border-radius: var(--wob-sm);
  border: 2.5px solid var(--ink); background: var(--ojt-panel); color: var(--ink); box-shadow: 3px 3px 0 var(--shadow-col);
  transition: transform .1s ease, box-shadow .1s ease, background .12s ease;
}
.ojt-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow-col); }
.ojt-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow-col); }
.ojt-btn-primary { background: var(--ojt-accent); color: var(--on-accent); border-color: var(--ink); }
.ojt-btn-primary:hover { background: var(--ojt-accent-dark); box-shadow: 4px 4px 0 var(--shadow-col); color: var(--on-accent); }
.ojt-btn-outline { background: var(--ojt-panel); border-width: 2.5px; border-color: var(--ink); color: var(--ink); }
.ojt-btn-outline:hover { background: var(--ojt-hover); color: var(--ink); border-color: var(--ink); }
.ojt-btn-danger { background: var(--ojt-panel); border-color: var(--ojt-danger); color: var(--ojt-danger); box-shadow: 3px 3px 0 var(--ojt-danger); }
.ojt-btn-danger:hover { background: var(--ojt-danger); color: #fff; box-shadow: 4px 4px 0 var(--shadow-col); }
.ojt-btn-ghost { background: transparent; border: none; box-shadow: none; padding: 4px 6px; font-size: 16px; color: var(--ojt-muted); }
.ojt-btn-ghost:hover { background: transparent; box-shadow: none; transform: none; color: var(--ink); text-decoration: underline wavy var(--coral); text-underline-offset: 4px; }
.ojt-btn-ghost:active { transform: none; box-shadow: none; }
.ojt-btn:disabled { box-shadow: none; opacity: 0.5; }
a.ojt-btn { display: inline-block; text-decoration: none; }
.ojt-icon-btn { border: 2.5px solid var(--ink); border-radius: 50% 46% 52% 48% / 48% 52% 46% 50%; background: var(--ojt-panel); color: var(--ink); box-shadow: 2px 2px 0 var(--shadow-col); font-size: 17px; }
.ojt-icon-btn:hover { background: var(--ojt-hover); animation: ojtWiggle .4s ease-in-out; }

/* forms: boxed like drawn-in fields */
.ojt-input, .ojt-select {
  border: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); border-radius: var(--wob-sm); background: var(--ojt-panel);
  color: var(--ink); font-size: 17px; padding: 7px 11px 6px;
}
.ojt-input::placeholder { color: var(--ojt-muted); opacity: 0.8; }
.ojt-input:focus, .ojt-select:focus { border-bottom-color: var(--ink); background: var(--ojt-panel); box-shadow: 3px 3px 0 var(--ojt-accent); }
[data-theme="dark"] .ojt-input:focus, [data-theme="dark"] .ojt-select:focus { border-bottom-color: var(--ink); }
.ojt-field label { font-family: var(--font-body); font-size: 15px; font-weight: 400; text-transform: none; letter-spacing: 0.01em; color: var(--ink); margin-bottom: 3px; }
.ojt-search-icon { color: var(--ink); font-size: 16px; }

/* progress: pencil-shaded bar */
.ojt-progress-track { height: 20px; border: 2.5px solid var(--ink); border-radius: var(--wob-sm); background: var(--ojt-panel); overflow: hidden; }
.ojt-progress-fill { background: repeating-linear-gradient(-45deg, var(--ojt-accent) 0 8px, var(--ojt-accent-dark) 8px 10px); border-right: 2.5px solid var(--ink); }
.ojt-progress-fill.complete { background: repeating-linear-gradient(-45deg, var(--mint) 0 8px, #8FD6AE 8px 10px); }
[data-theme="dark"] .ojt-progress-fill { background: repeating-linear-gradient(-45deg, var(--ojt-accent) 0 8px, #E0B93A 8px 10px); }
[data-theme="dark"] .ojt-progress-fill.complete { background: repeating-linear-gradient(-45deg, #4F9C77 0 8px, #3F7F5F 8px 10px); }

/* table: ledger drawn by hand */
.ojt-table { font-size: 16px; }
.ojt-table th { font-family: var(--font-disp); font-weight: 400; font-size: 19px; text-transform: none; letter-spacing: 0.02em; color: var(--ink); border-bottom: 3px solid var(--ink); }
[data-theme="dark"] .ojt-table th { color: var(--ink); border-bottom-color: var(--ink); }
.ojt-table td { border-bottom: 2px dashed var(--ojt-outline-border); }

    nxh("div",{className:"nx-chips"},list.map(x=>nxh("button",{key:x.id,className:"nx-chip"+(x.id===t.id?" on":""),onClick:()=>{setSel(x.id);setEdit(false);setMsg("")}},x.name))));
}


/* ===== Email verification + forgot password (Firebase Authentication) ===== */
const getAuth = async () => {
  await getDb();
  if (!window.firebase.auth) await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js");
  return window.firebase.auth();
};
const authMsg = e => {
  const c = String((e && e.code) || "");
  if (/email-already-in-use/.test(c)) return "That email is already registered. Sign in, or use Forgot password.";
  if (/invalid-email/.test(c)) return "That email address doesn't look right.";
  if (/weak-password/.test(c)) return "Password must be at least 6 characters.";
  if (/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)) return "Incorrect Student ID/email or password.";
  if (/too-many-requests/.test(c)) return "Too many attempts. Please wait a few minutes and try again.";
  if (/network-request-failed/.test(c)) return "Network problem. Check your internet connection and try again.";
  if (/operation-not-allowed|configuration-not-found/.test(c)) return "Email/Password sign-in isn't turned on yet. In the Firebase console: Authentication → Sign-in method → Email/Password → Enable.";
  if (/unauthorized-domain|operation-not-supported/.test(c)) return "Firebase sign-in doesn't work from this address. Host the page online, and add its domain under Authentication → Settings → Authorized domains.";
  return dbErrorMessage(e);
};
function AuthShell({ theme, children }) {
  return nxh("div", { className: "ojt-shell", "data-theme": theme }, nxh("style", null, CSS),
    nxh("div", { className: "ojt-app", style: { display: "flex", justifyContent: "center", paddingTop: 60 } },
      nxh("div", { className: "ojt-panel", style: { padding: 24, width: "100%", maxWidth: 420 } },
        nxh("img", { src: DOODLE_BADGE, alt: "", style: { width: 56, height: 56, display: "block", margin: "0 auto 12px" } }), children)));
}
const authNote = (n, bad) => n && nxh("p", { style: { color: bad ? "var(--ojt-danger)" : "var(--ojt-amber)", fontSize: 13, margin: "10px 0 0" } }, n);
function AuthGate({ gate, onResend, onCheck, onAddEmail, onCancel }) {
  const [note, setNote] = useState(null), [busy, setBusy] = useState(false), [em, setEm] = useState("");
  const run = async fn => { setBusy(true); const r = await fn(); setBusy(false); if (r && r.msg !== undefined) setNote(r); else if (typeof r === "string" && r) setNote({ ok: false, msg: r }); };
  const center = { textAlign: "center", color: "var(--ojt-muted)", fontSize: 13.5 };
  if (gate.type === "addemail") return nxh(React.Fragment, null,
    nxh("h2", { className: "disp", style: { textAlign: "center", margin: "0 0 4px" } }, "Add your email"),
    nxh("p", { style: center }, "Hi " + (gate.name || "") + "! Accounts now need a verified email so you can reset your password. We'll send a verification link."),
    nxh("div", { className: "ojt-field", style: { marginTop: 10 } }, nxh("label", null, "Email"), nxh("input", { className: "ojt-input", type: "email", value: em, autoFocus: true, autoComplete: "email", placeholder: "you@example.com", onChange: e => setEm(e.target.value), onKeyDown: e => e.key === "Enter" && run(() => onAddEmail(em)) })),
    authNote(note && note.msg, true),
    nxh("button", { className: "ojt-btn ojt-btn-primary", style: { width: "100%", marginTop: 16 }, disabled: busy, onClick: () => run(() => onAddEmail(em)) }, busy ? "Please wait…" : "Send verification link"),
    nxh("button", { className: "ojt-btn ojt-btn-ghost", style: { width: "100%", marginTop: 8 }, onClick: onCancel }, "Cancel"));
  return nxh(React.Fragment, null,
    nxh("h2", { className: "disp", style: { textAlign: "center", margin: "0 0 4px" } }, "Verify your email"),
    nxh("p", { style: center }, "We sent a verification link to"),
    nxh("p", { style: { textAlign: "center", fontWeight: 600, margin: "2px 0 8px", wordBreak: "break-all" } }, gate.email),
    nxh("p", { style: center }, "Open the email and click the link, then come back and press the button below. Check your spam folder if you don't see it."),
    authNote(note && note.msg, note && !note.ok),
    nxh("button", { className: "ojt-btn ojt-btn-primary", style: { width: "100%", marginTop: 16 }, disabled: busy, onClick: () => run(onCheck) }, busy ? "Please wait…" : "I've verified my email"),
    nxh("button", { className: "ojt-btn ojt-btn-outline", style: { width: "100%", marginTop: 8 }, disabled: busy, onClick: () => run(onResend) }, "Resend verification email"),
    nxh("button", { className: "ojt-btn ojt-btn-ghost", style: { width: "100%", marginTop: 8 }, onClick: onCancel }, "Cancel and sign out"));
}
function ForgotPanel({ onForgot, onBack }) {
  const [v, setV] = useState(""), [note, setNote] = useState(null), [busy, setBusy] = useState(false);
  const send = async () => { if (busy) return; setBusy(true); setNote(await onForgot(v)); setBusy(false); };
  return nxh(React.Fragment, null,
    nxh("h2", { className: "disp", style: { textAlign: "center", margin: "0 0 4px" } }, "Forgot password"),
    nxh("p", { style: { textAlign: "center", color: "var(--ojt-muted)", fontSize: 13.5 } }, "Enter your Student ID or email. We'll send a reset link to your registered email."),
    nxh("div", { className: "ojt-field", style: { marginTop: 10 } }, nxh("label", null, "Student ID or email"), nxh("input", { className: "ojt-input", value: v, autoFocus: true, onChange: e => setV(e.target.value), onKeyDown: e => e.key === "Enter" && send() })),
    authNote(note && note.msg, note && !note.ok),
    nxh("button", { className: "ojt-btn ojt-btn-primary", style: { width: "100%", marginTop: 16 }, disabled: busy, onClick: send }, busy ? "Please wait…" : "Send reset link"),
    nxh("button", { className: "ojt-btn ojt-btn-ghost", style: { width: "100%", marginTop: 8 }, onClick: onBack }, "Back to sign in"));
}

/* Click any profile photo to view it full size (helps the admin identify faces). */
document.addEventListener("click", e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !/\bojt-avatar(-sm)?\b/.test(img.className)) return;
  const box = document.createElement("div");
  box.className = "ojt-lightbox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Photo preview");
  const big = document.createElement("img");
  big.src = img.src;
  big.alt = "Full size photo";
  const x = document.createElement("button");
  x.textContent = "×";
  x.setAttribute("aria-label", "Close");
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  box.addEventListener("click", close);
  document.addEventListener("keydown", onKey);
  box.append(big, x);
  document.body.appendChild(box);
  e.stopPropagation();
}, true);
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
