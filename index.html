/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const nowISO = () => new Date().toISOString();
const combineDateTime = (dateStr, timeStr) => new Date(`${dateStr}T${timeStr}:00`).toISOString();
const toTimeInput = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fmtTime = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  let h = d.getHours();
  const m = pad(d.getMinutes());
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
};
const fmtDateLong = dateStr => {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  });
};
const hoursBetween = (a, b) => Math.max(0, (new Date(b) - new Date(a)) / 3600000);
const fmtHours = h => h == null || isNaN(h) ? "—" : h.toFixed(2);
const fmtElapsed = ms => {
  const totalMin = Math.floor(ms / 60000);

};

/* ---------- standalone persistence (this device's browser only, via localStorage) ---------- */
/* Replaces Claude's shared "db" capability, which only exists inside claude.ai artifacts.
   This shim keeps the exact same collection/doc API so the rest of the app is unchanged. */
function createLocalDb(storageKey) {
  const listeners = new Set();
  const read = () => {
    try {
      return JSON.parse(window.localStorage.getItem(storageKey) || "{}");
    } catch {
      return {};
    }
  };
  const write = (data) => {
    try {
      window.localStorage.setItem(storageKey, JSON.stringify(data));
    } catch {
      /* storage unavailable (private browsing, quota, etc.) — fails quietly like the old shim did */
    }
    listeners.forEach((fn) => fn());
  };
  const makeDoc = (path) => ({
    async get() {
      const data = read();
      const val = data[path];
      return { exists: val !== undefined, data: () => val };
    },
    async set(value) {
      const data = read();
      data[path] = value;
      write(data);
    },
    async delete() {
      const data = read();
      delete data[path];
      write(data);
    },
  });
  const makeCollection = (path) => {
    const prefix = path + "/";
    const self = {
      doc: (id) => makeDoc(prefix + id),
      async get() {
        const data = read();
        return {
          docs: Object.keys(data)
            .filter((k) => k.startsWith(prefix) && !k.slice(prefix.length).includes("/"))
            .map((k) => ({ id: k.slice(prefix.length), data: () => data[k] })),
        };
      },
      onSnapshot(onNext, onError) {
        let cancelled = false;
        const push = async () => {
          try {
            const snap = await self.get();
            if (!cancelled) onNext(snap);
          } catch (e) {
            if (!cancelled && onError) onError(e);
          }
        };
        listeners.add(push);
        push();
        return () => {
          cancelled = true;
          listeners.delete(push);
        };
      },
    };
    return self;
  };

}

async function hashPin(pin) {
  try {
    const enc = new TextEncoder().encode("ojt-logbook-" + pin);
    const buf = await window.crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 0;
    for (let i = 0; i < pin.length; i++) {
      h = (h * 31 + pin.charCodeAt(i)) | 0;
    }

const resizeImage = (file, maxDim = 260) => new Promise((resolve, reject) => {
  if (!file.type.startsWith("image/")) {
    reject(new Error("Not an image file"));
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let {
        width,
        height
      } = img;
      if (width > height) {
        if (width > maxDim) {
          height *= maxDim / width;
          width = maxDim;
        }
      } else if (height > maxDim) {
        width *= maxDim / height;
        height = maxDim;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => reject(new Error("Could not read image"));
    img.src = e.target.result;
  };
  reader.onerror = () => reject(new Error("Could not read file"));
  reader.readAsDataURL(file);
});
